<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="certGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Certificate Document -->
  <rect x="12" y="10" width="40" height="44" rx="4" fill="#ffffff" stroke="url(#certGrad)" stroke-width="3" filter="drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15))"/>
  <!-- Lines on Certificate -->
  <line x1="20" y1="18" x2="44" y2="18" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="24" x2="36" y2="24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="30" x2="44" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="36" x2="32" y2="36" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Steering Wheel Overlay -->
  <circle cx="42" cy="40" r="10" fill="url(#certGrad)" filter="drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.1))"/>
  <circle cx="42" cy="40" r="7" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="42" y1="33" x2="42" y2="47" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="35" y1="40" x2="49" y2="40" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Gold Stamp / Seal -->
  <circle cx="22" cy="44" r="7" fill="url(#ribbonGrad)" />
  <polygon points="19,50 22,46 25,50 23,43 21,43" fill="url(#ribbonGrad)"/>
</svg>
