<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="briefcaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  <!-- Briefcase Body -->
  <rect x="10" y="20" width="44" height="30" rx="6" fill="url(#briefcaseGrad)" filter="drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15))"/>
  <!-- Briefcase Handle -->
  <path d="M24,20 V14 A3,3 0 0,1 27,11 H37 A3,3 0 0,1 40,14 V20" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
  <!-- Benefit Card (overlapping) -->
  <rect x="26" y="30" width="28" height="18" rx="3" fill="url(#cardGrad)" filter="drop-shadow(-2px 3px 4px rgba(0, 0, 0, 0.2))"/>
  <!-- Card details -->
  <rect x="30" y="34" width="6" height="4" fill="#ffffff" opacity="0.8" rx="1"/>
  <line x1="30" y1="42" x2="48" y2="42" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="38" y1="36" x2="50" y2="36" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Briefcase Buckles -->
  <rect x="18" y="20" width="4" height="8" rx="1" fill="#e2e8f0"/>
  <rect x="42" y="20" width="4" height="8" rx="1" fill="#e2e8f0"/>
</svg>
