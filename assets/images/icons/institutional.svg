<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="stampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="gradCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Postal Stamp Frame -->
  <rect x="8" y="12" width="48" height="40" rx="4" fill="url(#stampGrad)" filter="drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15))"/>
  <!-- Perforation effect around stamp -->
  <circle cx="14" cy="12" r="2" fill="#f8f9fa"/>
  <circle cx="22" cy="12" r="2" fill="#f8f9fa"/>
  <circle cx="30" cy="12" r="2" fill="#f8f9fa"/>
  <circle cx="38" cy="12" r="2" fill="#f8f9fa"/>
  <circle cx="46" cy="12" r="2" fill="#f8f9fa"/>
  <circle cx="50" cy="12" r="2" fill="#f8f9fa"/>
  <circle cx="14" cy="52" r="2" fill="#f8f9fa"/>
  <circle cx="22" cy="52" r="2" fill="#f8f9fa"/>
  <circle cx="30" cy="52" r="2" fill="#f8f9fa"/>
  <circle cx="38" cy="52" r="2" fill="#f8f9fa"/>
  <circle cx="46" cy="52" r="2" fill="#f8f9fa"/>
  <circle cx="50" cy="52" r="2" fill="#f8f9fa"/>
  <circle cx="8" cy="20" r="2" fill="#f8f9fa"/>
  <circle cx="8" cy="28" r="2" fill="#f8f9fa"/>
  <circle cx="8" cy="36" r="2" fill="#f8f9fa"/>
  <circle cx="8" cy="44" r="2" fill="#f8f9fa"/>
  <circle cx="56" cy="20" r="2" fill="#f8f9fa"/>
  <circle cx="56" cy="28" r="2" fill="#f8f9fa"/>
  <circle cx="56" cy="36" r="2" fill="#f8f9fa"/>
  <circle cx="56" cy="44" r="2" fill="#f8f9fa"/>
  
  <!-- Graduation Cap & Building lines representing School / Postal / Work institutions -->
  <rect x="16" y="20" width="32" height="24" rx="2" fill="#ffffff" />
  <!-- Graduation mortarboard cap inside -->
  <polygon points="32,24 40,28 32,32 24,28" fill="url(#gradCap)"/>
  <polygon points="28,29 28,34 32,36 36,34 36,29" fill="url(#gradCap)"/>
  <line x1="39" y1="28.5" x2="41" y2="35" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="41" cy="35" r="1" fill="#f59e0b"/>
</svg>
