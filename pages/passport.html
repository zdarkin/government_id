<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Philippine Passport Guide</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="navbar-container"></div>

    <header class="detail-header">
      <div class="detail-header-content">
        <a href="national-civil.html" class="back-button">← Go Back</a>
        <h1 id="id-title">Loading...</h1>
        <p id="id-tagline"></p>
      </div>
    </header>

    <main class="detail-main">
      <div id="detail-container" class="detail-grid"></div>
    </main>

    <script src="../scripts/data.js"></script>
    <script src="../scripts/data-details.js"></script>
    <script>
      // 1. Fetch the passport data
      const data = idDetails["passport"];

      // 2. Populate Header
      document.getElementById("id-title").innerText = data.name;
      document.getElementById("id-tagline").innerText = data.tagline;

      // 3. Helper function to create HTML lists from our arrays
      const createList = (items, isNumbered = false) => {
        const tag = isNumbered ? "ol" : "ul";
        const classStr = isNumbered ? "step-list" : "bullet-list";
        return (
          `<${tag} class="${classStr}">` +
          items.map((item) => `<li>${item}</li>`).join("") +
          `</${tag}>`
        );
      };

      // 4. Build the page sections
      const container = document.getElementById("detail-container");
      container.innerHTML = `
        <div class="detail-column">
          <section class="info-card">
            <h3>Quick Facts</h3>
            <p><strong>💰 Cost:</strong> ${data.cost}</p>
            <p><strong>⏳ Processing Time:</strong> ${data.processingTime}</p>
            <p><strong>📅 Validity:</strong> ${data.validity}</p>
          </section>

          <section class="content-section">
            <h2>Documentary Requirements</h2>
            ${createList(data.requirements)}
          </section>

          <section class="content-section">
            <h2>Eligibility</h2>
            ${createList(data.eligibility)}
          </section>
        </div>

        <div class="detail-column">
          <section class="content-section">
            <h2>How to Apply - Step by Step</h2>
            ${createList(data.steps, true)}
          </section>

          <section class="content-section">
            <h2>Where This ID Is Accepted</h2>
            ${createList(data.acceptedAt)}
          </section>

          <div class="reminder-box">
            <strong>⚠️ Important Reminder:</strong> ${data.reminder}
          </div>
        </div>
      `;
    </script>

    <script src="../scripts/load-navbar.js"></script>
  </body>
</html>
